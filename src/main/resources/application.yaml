spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://100.92.51.27:3306/db_auth
    driverClassName: com.mysql.cj.jdbc.Driver
    username: equipo
    password: ${DB_PASSWORD}

  jpa:
